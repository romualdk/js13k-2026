<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rainbow Runner — Canvas</title>
<meta name="description" content="Unicorn running minigame rendered entirely with HTML Canvas.">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #bff3f8;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Rainbow Runner"></canvas>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Canvas setup
  // ---------------------------------------------------------------------------

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
  });

  let dpr = 1;
  let W = 0;
  let H = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ---------------------------------------------------------------------------
  // Assets
  // ---------------------------------------------------------------------------

  const assets = {};

  function loadImage(key, src) {
    const img = new Image();
    img.decoding = "async";
    img.src = src;
    assets[key] = img;
    return img;
  }

  loadImage("unicornSide", "assets/unicorn-side.svg");
  loadImage("star", "assets/star.svg");
  loadImage("gate", "assets/gate.svg");
  loadImage("rainbow", "assets/rainbow.svg");

  // ---------------------------------------------------------------------------
  // Game state (2 Lanes: 0 = Left, 1 = Right)
  // ---------------------------------------------------------------------------

  const laneColors = ["yellow", "blue"];
  const gateColors = ["yellow", "blue"];

  let currentLane = 0;
  let distance = 0;
  let points = 0;
  let health = 2;
  let nextHealthThreshold = 50;

  let spawnTimer = 0;
  const SPAWN_EVERY_FRAMES = 75;
  
  // Speed in pixels per millisecond (constant visual speed down the screen)
  const PIXEL_SPEED = 0.5;

  let lastTime = performance.now();
  let gameOverFlash = 0;
  let hitFlash = 0;

  const entities = [];

  // ---------------------------------------------------------------------------
  // Linear Layout Geometry
  // ---------------------------------------------------------------------------

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function roadGeometry() {
    const horizonY = H * 0.29;
    const bottomY = H * 1.08;
    const centerX = W * 0.5;

    const topHalf = Math.min(W * 0.055, 65);
    const bottomHalf = W * 0.485;

    return { horizonY, bottomY, centerX, topHalf, bottomHalf };
  }

  function roadAtT(t) {
    const g = roadGeometry();
    t = clamp01(t);
    
    const y = lerp(g.horizonY, g.bottomY, t);
    const half = lerp(g.topHalf, g.bottomHalf, t);
    
    return {
      y,
      left: g.centerX - half,
      right: g.centerX + half,
      center: g.centerX
    };
  }

  function laneEdges(lane, t) {
    const r = roadAtT(t);
    const x1 = lerp(r.left, r.right, lane / 2);
    const x2 = lerp(r.left, r.right, (lane + 1) / 2);
    return { x1, x2, width: x2 - x1 };
  }

  function playerCenterX() {
    return W * [0.30, 0.70][currentLane];
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------

  function movePlayer(direction) {
    const prevLane = currentLane;

    if (direction < 0 && currentLane > 0) currentLane--;
    if (direction > 0 && currentLane < 1) currentLane++;

    return prevLane !== currentLane;
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
      movePlayer(-1);
    } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
      movePlayer(1);
    }
  }, { passive: true });

  canvas.addEventListener("pointerdown", (e) => {
    movePlayer(e.clientX < W * 0.5 ? -1 : 1);
  }, { passive: true });

  // ---------------------------------------------------------------------------
  // Spawning
  // ---------------------------------------------------------------------------

  function spawnEntity() {
    const lane = (Math.random() * 2) | 0;
    const isGate = Math.random() < 0.45;

    entities.push({
      lane,
      y: roadGeometry().horizonY, // Start position in actual screen pixels (Y coordinates)
      type: isGate ? "gate" : "star",
      color: isGate ? gateColors[(Math.random() * 2) | 0] : null,
      hasCollided: false,
      phase: Math.random() * Math.PI * 2
    });
  }

  // ---------------------------------------------------------------------------
  // Drawing primitives
  // ---------------------------------------------------------------------------

  function roundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function starPath(cx, cy, outerR, innerR, points = 5) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / points;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // ---------------------------------------------------------------------------
  // Background & Road
  // ---------------------------------------------------------------------------

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#82e7f1");
    sky.addColorStop(0.42, "#f6b9e5");
    sky.addColorStop(0.72, "#ffe7df");
    sky.addColorStop(1, "#fff3ad");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const haze = ctx.createRadialGradient(W * 0.5, H * 0.53, 0, W * 0.5, H * 0.53, W * 0.55);
    haze.addColorStop(0, "rgba(255,255,255,0.72)");
    haze.addColorStop(0.55, "rgba(255,250,255,0.20)");
    haze.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    drawRainbow();
  }

  function drawRainbow() {
    const img = assets.rainbow;
    if (!img.complete || !img.naturalWidth) return;

    const targetW = Math.min(W * 1.90, 1100);
    const targetH = targetW * (img.naturalHeight / img.naturalWidth);
    const x = (W - targetW) * 0.5;
    const y = H * 0.055;

    ctx.save();
    ctx.globalAlpha = 0.86;
    ctx.drawImage(img, x, y, targetW, targetH);
    ctx.restore();
  }

  function drawRoad() {
    const g = roadGeometry();

    const outer = ctx.createLinearGradient(0, g.horizonY, 0, H);
    outer.addColorStop(0, "rgba(90,63,160,0)");
    outer.addColorStop(0.45, "rgba(112,82,170,0.13)");
    outer.addColorStop(1, "rgba(80,50,120,0.08)");

    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.moveTo(g.centerX - g.topHalf, g.horizonY);
    ctx.lineTo(g.centerX + g.topHalf, g.horizonY);
    ctx.lineTo(g.centerX + g.bottomHalf, H);
    ctx.lineTo(g.centerX - g.bottomHalf, H);
    ctx.closePath();
    ctx.fill();

    const laneColorsLocal = [
      ["#ffef00", "#ff9d00", "#ff4c08", "rgba(255,235,0,0.75)"],
      ["#19efff", "#008ede", "#383ac7", "rgba(35,234,255,0.80)"]
    ];

    for (let lane = 0; lane < 2; lane++) {
      const top = laneEdges(lane, 0);
      const bottom = laneEdges(lane, 1);

      const grad = ctx.createLinearGradient(0, g.horizonY, 0, H);
      grad.addColorStop(0, laneColorsLocal[lane][1]);
      grad.addColorStop(0.42, laneColorsLocal[lane][1]);
      grad.addColorStop(1, laneColorsLocal[lane][2]);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(top.x1, g.horizonY);
      ctx.lineTo(top.x2, g.horizonY);
      ctx.lineTo(bottom.x2, H);
      ctx.lineTo(bottom.x1, H);
      ctx.closePath();
      ctx.fill();

      const borderWidth = Math.max(2, W * 0.004);
      ctx.strokeStyle = "#f9feff";
      ctx.lineWidth = borderWidth;
      ctx.globalAlpha = 0.80;

      ctx.beginPath();
      ctx.moveTo(top.x1, g.horizonY);
      ctx.lineTo(bottom.x1, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(top.x2, g.horizonY);
      ctx.lineTo(bottom.x2, H);
      ctx.stroke();

      ctx.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------------
  // Entities
  // ---------------------------------------------------------------------------

 function getTFromY(y) {
  const g = roadGeometry();
  // 1. Get the normal linear ratio (0 to 1)
  let linearT = clamp01((y - g.horizonY) / (g.bottomY - g.horizonY));
  
  // 2. Apply an exponent (power > 1) to create acceleration.
  // A power of 2 means it starts very slow near the horizon and speeds up toward the bottom.
  return Math.pow(linearT, 2); 
}

  function projectEntity(ent) {
    const t = getTFromY(ent.y);
    const road = roadAtT(t);

    const lane = laneEdges(ent.lane, t);
    const x = (lane.x1 + lane.x2) * 0.5;
    const laneWidth = lane.width;

    return { t, x, y: road.y, laneWidth };
  }

  function drawStarEntity(ent, time) {
    const p = projectEntity(ent);
    const bob = Math.sin(time * 0.005 + ent.phase) * 4;
    const img = assets.star;

    const drawW = Math.max(12, p.laneWidth * 0.55);
    const drawH = img.naturalWidth && img.naturalHeight
      ? drawW * (img.naturalHeight / img.naturalWidth)
      : drawW;
    const drawX = p.x - drawW * 0.5;
    const drawY = p.y - drawH * 0.78 + bob;

    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = "#5b2876";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + drawW * 0.28, drawW * 0.35, drawW * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (img.complete && img.naturalWidth) {
      ctx.save();
      ctx.globalAlpha = 0.96;
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();
    }
  }

  function drawGateEntity(ent) {
    const p = projectEntity(ent);
    const img = assets.gate;

    const gateW = Math.max(30, p.laneWidth * 0.95);
    const gateH = img.naturalWidth && img.naturalHeight
      ? gateW * (img.naturalHeight / img.naturalWidth)
      : gateW;
    const x = p.x - gateW * 0.5;
    const y = p.y - gateH;

    ctx.save();
    ctx.fillStyle = "rgba(65,30,80,0.22)";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 5, gateW * 0.35, gateW * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!img.complete || !img.naturalWidth) return;

    const tint = ent.color === "yellow"
      ? "sepia(1) saturate(5) hue-rotate(350deg) brightness(1.15)"
      : "hue-rotate(155deg) saturate(1.8) brightness(1.10)";

    ctx.save();
    ctx.filter = tint;
    ctx.globalAlpha = 1;
    ctx.drawImage(img, x, y, gateW, gateH);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Player & HUD
  // ---------------------------------------------------------------------------

  function drawPlayer(time) {
    const img = assets.unicornSide;
    const x = playerCenterX();
    const baseY = H - Math.max(95, H * 0.12);
    const bob = Math.sin(time * 0.010) * 8;

    const playerH = Math.min(H * 0.34, 270);
    const playerW = playerH * (145 / 204);

    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = "#4e1e70";
    ctx.beginPath();
    ctx.ellipse(x, baseY + playerH * 0.06, playerW * 0.42, playerH * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!img.complete || !img.naturalWidth) return;

    ctx.save();
    if (currentLane === 0) {
      ctx.translate(x, 0);
      ctx.scale(-1, 1);
      ctx.translate(-x, 0);
    }

    if (hitFlash > 0) {
      ctx.globalAlpha = 1;
    }

    ctx.drawImage(
      img,
      x - playerW * 0.5,
      baseY - playerH + bob,
      playerW,
      playerH
    );

    ctx.restore();
  }

  function drawHud() {
    const barW = Math.min(W * 0.82, 540);
    const barH = Math.max(54, Math.min(76, H * 0.09));
    const x = (W - barW) * 0.5;
    const y = 12;

    ctx.save();

    roundedRect(x, y, barW, barH, 22);
    ctx.fillStyle = "#5b2c82";
    ctx.fill();

    roundedRect(x + 5, y + 5, barW - 10, barH - 10, 18);
    const plate = ctx.createLinearGradient(0, y, 0, y + barH);
    plate.addColorStop(0, "#dba5ef");
    plate.addColorStop(1, "#8b48a9");
    ctx.fillStyle = plate;
    ctx.fill();

    const iconR = Math.min(barH * 0.24, 20);
    const iconX = x + barW * 0.10;
    const iconY = y + barH * 0.50;

    ctx.fillStyle = "#ffe952";
    ctx.strokeStyle = "#a75a3c";
    ctx.lineWidth = 2;
    starPath(iconX, iconY, iconR, iconR * 0.44);
    ctx.fill();
    ctx.stroke();

    const fs = Math.max(18, Math.min(34, W * 0.042));
    ctx.font = `900 ${fs}px "Segoe UI", Tahoma, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(3, fs * 0.20);
    ctx.strokeText(`DISTANCE: ${Math.floor(distance)}m`, x + barW * 0.18, iconY);

    ctx.fillStyle = "#4a154b";
    ctx.fillText(`DISTANCE: ${Math.floor(distance)}m`, x + barW * 0.18, iconY);

    const smallFs = Math.max(12, Math.min(18, W * 0.021));
    ctx.font = `800 ${smallFs}px "Segoe UI", Tahoma, sans-serif`;
    ctx.textAlign = "right";
    ctx.fillStyle = "#4a154b";
    ctx.globalAlpha = 0.92;

    ctx.fillText(`POINTS ${points}   •   HEALTH ${health}`, x + barW - 18, y + barH - 13);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Collision / scoring
  // ---------------------------------------------------------------------------

  function updateEntities(dt) {
    const g = roadGeometry();

    for (let i = entities.length - 1; i >= 0; i--) {
      const ent = entities[i];

      // Update screen Y position at a strictly constant linear speed
      ent.y += PIXEL_SPEED * dt;

      const t = getTFromY(ent.y);

      if (t > 1.05) {
        entities.splice(i, 1);
        continue;
      }

      const isColliding =
        !ent.hasCollided &&
        t > 0.88 &&
        t < 1.02 &&
        ent.lane === currentLane;

      if (!isColliding) continue;

      ent.hasCollided = true;

      if (ent.type === "gate") {
        const activeColor = laneColors[currentLane];

        if (ent.color === activeColor) {
          points += 5;
        } else {
          points -= 10;
          hitFlash = 1.0;
        }
      } else {
        points += 1;
        entities.splice(i, 1);
      }

      if (points <= 0) {
        points = 0;
        health--;

        if (health <= 0) {
          resetGame();
          return;
        }
      } else if (points >= nextHealthThreshold) {
        health++;
        nextHealthThreshold += 50;
      }
    }
  }

  function resetGame() {
    distance = 0;
    points = 0;
    health = 2;
    nextHealthThreshold = 50;
    entities.length = 0;
    gameOverFlash = 0.35;
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------

  function frame(now) {
    const dt = Math.min(2.0, (now - lastTime) / 16.6667);
    lastTime = now;

    distance += 0.1 * dt;
    spawnTimer += dt;

    if (spawnTimer >= SPAWN_EVERY_FRAMES) {
      spawnEntity();
      spawnTimer -= SPAWN_EVERY_FRAMES;
    }

    hitFlash = Math.max(0, hitFlash - dt * 0.055);
    gameOverFlash = Math.max(0, gameOverFlash - dt * 0.02);

    updateEntities(dt);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawBackground();
    drawRoad();

    entities.sort((a, b) => a.y - b.y);

    for (let i = 0; i < entities.length; i++) {
      const ent = entities[i];
      if (ent.type === "star") drawStarEntity(ent, now);
      else drawGateEntity(ent);
    }

    drawPlayer(now);
    drawHud();

    if (gameOverFlash > 0) {
      ctx.fillStyle = `rgba(255,90,140,${gameOverFlash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
