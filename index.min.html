<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Runner</title>
    <meta name="description" content="Unicorn running minigame! Collect stars and race down the rainbow road.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #fff2f9; 
            background-image: 
                radial-gradient(circle at top left, #ff9de2 0%, transparent 60%),
                radial-gradient(circle at top right, #72f5ff 0%, transparent 60%),
                radial-gradient(circle at bottom right, #ffe17d 0%, transparent 60%),
                radial-gradient(circle at bottom left, #ffb3c6 0%, transparent 60%); 
        }
        
        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #cloudCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #sparkleCanvas { z-index: 3; pointer-events: none; }

        /* --- GAME HUD --- */
        #gameHUD {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 48px;
            background: rgba(30, 20, 40, 0.85);
            padding: 10px 48px;
            border-radius: 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 182, 215, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: #ff9de2;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(8px);
            align-items: center;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hud-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            margin-top: -4px;
            margin-bottom: -4px;
        }

        .hud-icon.rainbow-left-half {
            width: 80px;
            height: 80px;
            object-position: left;
            clip-path: inset(0 50% 0 0);
            margin-right: -30px;
            margin-top: -6px;
            margin-bottom: -6px;
        }

        #fpsCounter {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameHUD">
    <div class="hud-item"><img src="assets/rainbow.svg" class="hud-icon rainbow-left-half" alt="Rainbows"><span id="hudRainbows">0</span></div>
    <div class="hud-item"><img src="assets/unicorn-side.svg" class="hud-icon" alt="Distance"><span id="hudDist">0</span>m</div>
    <div class="hud-item"><img src="assets/star.svg" class="hud-icon" alt="Stars"><span id="hudStars">0</span></div>
</div>

<div id="fpsCounter">FPS: 60 | Speed: 1.00x | Entities: 0 | Time: 00:00 | Dist: 0.00m | Stars: 0 | Rainbows: 0</div>
<div class="canvas-container">
    <canvas id="cloudCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>
</div>
