<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unicorn Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, #bbf2f6, #ffe1e8);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 30px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      font-weight: bold;
      color: #4a154b;
      text-shadow: 2px 2px 0 #fff;
      font-size: 1.8rem;
      pointer-events: none;
    }

    /* 3 Lanes Layout */
  .road-lanes {
  display: flex;
  gap: 4%; /* Creates a proportional gap between the lanes */
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
}



.lane {
      position: relative;
      flex: 1;
      transform-style: preserve-3d;
    }

    /* --- LANE 1: YELLOW --- */
    .lane:nth-child(1) { 
      background: 
        /* Left inner core stripe */
        linear-gradient(to bottom, transparent 0%, #ffea00 45%, #ffea00 75%),
        /* Right inner core stripe */
        linear-gradient(to bottom, transparent 0%, #ffea00 45%, #ffea00 75%),
        /* Main lane gradient */
        linear-gradient(to bottom, transparent 0%, #ffa801 45%, #ff4900 75%, #ffa801 100%);
      background-size: 10px 100%, 10px 100%, 100% 100%;
      background-position: 15px 0, calc(100% - 15px) 0, 0 0;
      background-repeat: no-repeat;
    }

    .lane:nth-child(1)::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        linear-gradient(to bottom, transparent 0%, rgba(255, 234, 0, 0.8) 45%, rgba(255, 234, 0, 0.8) 75%),
        linear-gradient(to bottom, transparent 0%, rgba(255, 234, 0, 0.8) 45%, rgba(255, 234, 0, 0.8) 75%);
      background-size: 22px 100%, 22px 100%;
      background-position: calc(15px - 6px) 0, calc(100% - 15px - 6px) 0;
      background-repeat: no-repeat;
      filter: blur(8px); /* Soft Gaussian blur for the glow */
    }

    /* --- LANE 2: BLUE --- */
    .lane:nth-child(2) { 
      background: 
        /* Left inner core stripe */
        linear-gradient(to bottom, transparent 0%, #00e5ff 45%, #00e5ff 75%),
        /* Right inner core stripe */
        linear-gradient(to bottom, transparent 0%, #00e5ff 45%, #00e5ff 75%),
        /* Main lane gradient */
        linear-gradient(to bottom, transparent 0%, #098bd7 45%, #6c32c4 75%, #098bd7 100%);
      background-size: 10px 100%, 10px 100%, 100% 100%;
      background-position: 15px 0, calc(100% - 15px) 0, 0 0;
      background-repeat: no-repeat;
    }

    .lane:nth-child(2)::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        linear-gradient(to bottom, transparent 0%, rgba(0, 229, 255, 0.8) 45%, rgba(0, 229, 255, 0.8) 75%),
        linear-gradient(to bottom, transparent 0%, rgba(0, 229, 255, 0.8) 45%, rgba(0, 229, 255, 0.8) 75%);
      background-size: 22px 100%, 22px 100%;
      background-position: calc(15px - 6px) 0, calc(100% - 15px - 6px) 0;
      background-repeat: no-repeat;
      filter: blur(8px);
    }

    /* --- LANE 3: PINK --- */
    .lane:nth-child(3) { 
      background: 
        /* Left inner core stripe */
        linear-gradient(to bottom, transparent 0%, #ffcbdc 45%, #ffcbdc 75%),
        /* Right inner core stripe */
        linear-gradient(to bottom, transparent 0%, #ffcbdc 45%, #ffcbdc 75%),
        /* Main lane gradient */
        linear-gradient(to bottom, transparent 0%, #fd1767 45%, #c6024c 75%, #fd1767 100%);
      background-size: 10px 100%, 10px 100%, 100% 100%;
      background-position: 15px 0, calc(100% - 15px) 0, 0 0;
      background-repeat: no-repeat;
    }

    .lane:nth-child(3)::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background: 
        linear-gradient(to bottom, transparent 0%, rgba(255, 203, 220, 0.8) 45%, rgba(255, 203, 220, 0.8) 75%),
        linear-gradient(to bottom, transparent 0%, rgba(255, 203, 220, 0.8) 45%, rgba(255, 203, 220, 0.8) 75%);
      background-size: 22px 100%, 22px 100%;
      background-position: calc(15px - 6px) 0, calc(100% - 15px - 6px) 0;
      background-repeat: no-repeat;
      filter: blur(8px);
    }


    /* 1. Bring the virtual camera closer to exaggerate the perspective */
.game-viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  perspective: 200px; /* Reduced from 700px to dramatically widen the foreground and shrink the background */
  perspective-origin: 50% 20%; /* Pushes the vanishing point higher up for a deep horizon */
}

/* 2. Fine-tune the road tilt and counter-rotations */
.road-container {
  position: absolute;
  bottom: 0px;
  left: 50%;
  width: 100vw;
  max-width: 1200px; /* Increased from 900px to push the lanes even further apart at the bottom */
  height: 200vh;
  transform: translateX(-50%) rotateX(68deg);
  transform-style: preserve-3d;
  transform-origin: bottom center;
}

/* 3. Update counter-rotations to match the new 68deg tilt */
.player {
  position: absolute;
  bottom: 40px;
  transform: translateX(-50%) rotateX(-68deg); /* Updated to -68deg so sprite stays upright */
  transform-origin: bottom center;
  transition: left 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.entity {
  position: absolute;
  width: 55px;
  height: 55px;
  transform: translateX(-50%) rotateX(-68deg); /* Updated to -68deg so sprites stay upright */
  transform-origin: bottom center;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 3rem;
}
  </style>
</head>
<body>

  <div class="game-viewport" id="viewport">
    <div class="ui-layer" id="score-display">DISTANCE: 0m</div>

    <div class="road-container" id="road-container">
      <div class="road-lanes">
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
      </div>
      <div id="entities-layer" style="position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; top: 0; left: 0; pointer-events: none;"></div>
      <div class="player" id="player"><img src="unicorn.png" width="145" height="204" /></div>
    </div>

    
  </div>

  <script>
    const player = document.getElementById('player');
    const roadContainer = document.getElementById('road-container');
    const entitiesLayer = document.getElementById('entities-layer');
    const scoreDisplay = document.getElementById('score-display');
    const viewport = document.getElementById('viewport');

    let currentLane = 1; // 0: Left, 1: Center, 2: Right
    let distance = 0;
    let gameSpeed = 6;
    let entities = [];
    let spawnTimer = 0;

    // Lane centers as exact percentage offsets of the road container width (3 lanes = 16.67%, 50%, 83.33%)
    const lanePercentages = [15.3, 50, 84.7];

    function updatePlayerPosition() {
      player.style.left = lanePercentages[currentLane] + '%';
    }

    // PC Keyboard Controls
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
        currentLane--;
        updatePlayerPosition();
      } else if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
        currentLane++;
        updatePlayerPosition();
      }
    });

    // Mobile & PC Tap/Click Controls (Tap left or right side of screen)
    viewport.addEventListener('pointerdown', (e) => {
      // Ignore clicks on UI elements if any
      const screenWidth = window.innerWidth;
      if (e.clientX < screenWidth / 2) {
        if (currentLane > 0) currentLane--;
      } else {
        if (currentLane < 2) currentLane++;
      }
      updatePlayerPosition();
    });

    // Spawner function
    function spawnEntity() {
      const lane = Math.floor(Math.random() * 3);
      const el = document.createElement('div');
      el.className = 'entity';
      el.innerHTML = '<img src="assets/star.svg" />';
      
      const entityObj = {
        element: el,
        lane: lane,
        y: -100 // Start at top of the road container
      };

      el.style.left = lanePercentages[lane] + '%';
      el.style.top = entityObj.y + 'px';

      entitiesLayer.appendChild(el);
      entities.push(entityObj);
    }

    // Main Game Loop
    function gameLoop() {
      distance += 0.5;
      scoreDisplay.innerText = `DISTANCE: ${Math.floor(distance)}m`;

      spawnTimer++;
      if (spawnTimer > 45) {
        spawnEntity();
        spawnTimer = 0;
      }

      const containerHeight = roadContainer.clientHeight;

      for (let i = entities.length - 1; i >= 0; i--) {
        let ent = entities[i];
        ent.y += gameSpeed;
        ent.element.style.top = ent.y + 'px';

        // Collision check near bottom where player sits
        // OLD CODE:
// if (ent.y > containerHeight * 0.72 && ent.y < containerHeight * 0.9) { ... }

// NEW CODE:
if (ent.y > containerHeight - 140 && ent.y < containerHeight - 80) {
  if (ent.lane === currentLane) {
    ent.element.remove();
    entities.splice(i, 1);
    continue;
  }
}

        // Remove out-of-bounds entities
        if (ent.y > containerHeight + 100) {
          ent.element.remove();
          entities.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Initialize
    updatePlayerPosition();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
