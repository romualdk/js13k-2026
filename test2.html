<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Projection Cube - Deep Extended Depth</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Resize canvas to fill the whole screen dynamically
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Cube dimensions and deeply extended depth coordinates
const size = 350;
const zBack = 2200;  // Pushed significantly further away
const zFront = 150;  // Closest face to the screen/player

const vertices = [
    {x: -size, y: -size, z: zBack},  // 0: back-top-left
    {x:  size, y: -size, z: zBack},  // 1: back-top-right
    {x:  size, y:  size, z: zBack},  // 2: back-bottom-right
    {x: -size, y:  size, z: zBack},  // 3: back-bottom-left
    {x: -size, y: -size, z: zFront}, // 4: front-top-left
    {x:  size, y: -size, z: zFront}, // 5: front-top-right
    {x:  size, y:  size, z: zFront}, // 6: front-bottom-right
    {x: -size, y:  size, z: zFront}  // 7: front-bottom-left
];

const edges = [
    // Back face (Spawner wall)
    [0,1], [1,2], [2,3], [3,0],
    // Front face
    [4,5], [5,6], [6,7], [7,4],
    // Connecting edges
    [0,4], [1,5], [2,6], [3,7]
];

// Camera and projection settings
const fov = 400;

function project(vert) {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const scale = fov / vert.z;
    return {
        x: vert.x * scale + cx,
        y: vert.y * scale + cy,
        scale: scale
    };
}

// Spawner configuration (moving in a circle on the back face)
let spawnerAngle = 0;
const spawnerRadius = size * 0.7;
const spawnerPosition = {
    x: 0,
    y: 0,
    z: zBack
};

let entities = [];
let spawnTimer = 0;
const spawnInterval = 30; // Equal intervals (every 30 frames)

function updateSpawner() {
    spawnerAngle += 0.03;
    spawnerPosition.x = Math.cos(spawnerAngle) * spawnerRadius;
    spawnerPosition.y = Math.sin(spawnerAngle) * spawnerRadius;
}

function spawnEntity() {
    entities.push({
        x: spawnerPosition.x,
        y: spawnerPosition.y,
        z: spawnerPosition.z,
        speed: 9.0, // Increased speed to match the much longer travel distance
        baseRadius: 12
    });
}

// Main Game Loop
function update() {
    updateSpawner();

    // Spawn at strict equal intervals
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnEntity();
    }

    // Update entity positions (moving toward the player: z decreases from zBack to zFront)
    for (let i = entities.length - 1; i >= 0; i--) {
        entities[i].z -= entities[i].speed;
        
        // Remove entities once they pass the front face of the cube
        if (entities[i].z < zFront) {
            entities.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Draw Cube Edges
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 3;
    edges.forEach(edge => {
        const p1 = project(vertices[edge[0]]);
        const p2 = project(vertices[edge[1]]);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
    });

    // 2. Draw Entities (sorted by depth so closer ones render on top)
    entities.sort((a, b) => b.z - a.z);

    entities.forEach(ent => {
        const p = project(ent);
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, ent.baseRadius * p.scale, 0, Math.PI * 2);
        ctx.fillStyle = '#00ffcc';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * p.scale;
        ctx.stroke();
    });

    // 3. Draw Spawner Position Indicator (Red Dot on the Back Face)
    const spawnerProj = project(spawnerPosition);
    ctx.beginPath();
    ctx.arc(spawnerProj.x, spawnerProj.y, 9 * spawnerProj.scale, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3333';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * spawnerProj.scale;
    ctx.stroke();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
