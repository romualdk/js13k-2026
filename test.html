<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen 2D Pseudo-3D Canvas - Layer Toggles</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #fff2f9; 
            background-image: 
                radial-gradient(circle at top left, #ff9de2 0%, transparent 60%),
                radial-gradient(circle at top right, #72f5ff 0%, transparent 60%),
                radial-gradient(circle at bottom right, #ffe17d 0%, transparent 60%),
                radial-gradient(circle at bottom left, #ffb3c6 0%, transparent 60%); 
        }
        
        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #cloudCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #sparkleCanvas { z-index: 3; pointer-events: none; }

        #fpsCounter {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="fpsCounter">FPS: 60 | Entities: 0 | Time: 00:00 | Dist: 0.00m</div>
<div class="canvas-container">
    <canvas id="cloudCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>
</div>

<script>
// --- CANVAS SETUP ---
const cloudCanvas = document.getElementById('cloudCanvas');
const cloudCtx = cloudCanvas.getContext('2d');

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const sparkleCanvas = document.getElementById('sparkleCanvas');
const sparkleCtx = sparkleCanvas.getContext('2d');

const fpsElem = document.getElementById('fpsCounter');

// --- METRICS TRACKING ---
let gameTime = 0; // Total active seconds
let gameDistance = 0; // Accumulated distance units

// --- LAYER VISIBILITY & KEYBOARD CONTROLS ---
let debugMode = false;
let showCloudLayer = true;
let showMainLayer = true;
let showSparkleLayer = true;

window.addEventListener('keydown', (e) => {
    if (e.key === 'd' || e.key === 'D') {
        debugMode = !debugMode;
        fpsElem.style.display = debugMode ? 'block' : 'none';
    }
    if (e.key === '1') {
        showCloudLayer = !showCloudLayer;
        cloudCanvas.style.display = showCloudLayer ? 'block' : 'none';
    }
    if (e.key === '2') {
        showMainLayer = !showMainLayer;
        canvas.style.display = showMainLayer ? 'block' : 'none';
    }
    if (e.key === '3') {
        showSparkleLayer = !showSparkleLayer;
        sparkleCanvas.style.display = showSparkleLayer ? 'block' : 'none';
    }
});

// --- ASSET PRELOADING WITH INLINE FALLBACKS ---
const DEFAULT_CLOUD_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><path fill="%23ffffff" opacity="0.85" d="M30 70 A30 30 0 0 1 60 30 A40 40 0 0 1 130 25 A35 35 0 0 1 170 60 A25 25 0 0 1 150 85 L40 85 A25 25 0 0 1 30 70 Z"/></svg>';

const ASSETS = {
    star: new Image(),
    sparkle: new Image(),
    gate: new Image(),
    cloud: new Image()
};

ASSETS.star.src = 'assets/star.svg';
ASSETS.sparkle.src = 'assets/sparkle.svg';
ASSETS.gate.src = 'assets/gate.svg';
ASSETS.cloud.src = 'assets/cloud.svg';

ASSETS.cloud.onerror = () => {
    ASSETS.cloud.src = DEFAULT_CLOUD_SVG;
};

// --- SPEED & SPAWN CONFIGURATION ---
const STAR_SPEED    = 0.4; 
const SPARKLE_SPEED = 0.5; 
const GATE_SPEED    = 0.4;
const CLOUD_SPEED   = 0.3;

const SPAWN_INTERVAL = 0.5; // Equal time distance between each single item spawn
const SPAWNER_RADIUS = 0.3; // Circular spawner radius scale on back face
const SPAWNER_SPEED  = 1.5;  // Angular velocity of spawner circle

const FIXED_STAR_SIZE = 65;  // Uniform default size for all stars

function resize() {
    cloudCanvas.width = window.innerWidth;
    cloudCanvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    sparkleCanvas.width = window.innerWidth;
    sparkleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- PROJECTION GEOMETRY (Matching Deep 3D Cube Spawner) ---
const projection = {
    getCubeParams() {
        const w = canvas.width;
        const h = canvas.height;
        const size = Math.min(w, h) * 0.35;
        
        return {
            size: size,
            zBack: 2200,   // Deep back face (Spawner location)
            zFront: 150,   // Closest face to screen/player
            fov: 400
        };
    },

    project(ent) {
        const { size, zBack, zFront, fov } = this.getCubeParams();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const currentZ = zBack - (zBack - zFront) * ent.z;
        const scale = fov / currentZ;

        const worldX = ent.x * size;
        const worldY = (ent.yRel - 0.5) * size * 2;

        return {
            x: worldX * scale + cx,
            y: worldY * scale + cy,
            scale: scale,
            currentZ: currentZ
        };
    }
};

// --- SPRAY HELPER ---
function getRandomFullSpanX() {
    return -2.5 + Math.random() * 5.0;
}

// --- GAME STATE ---
const entities = [];

// --- CIRCULAR SPAWNER ---
const spawner = {
    angle: 0,
    timer: 0,

    getPos() {
        const { size } = projection.getCubeParams();
        const radius = size * SPAWNER_RADIUS;

        const x = Math.cos(this.angle) * radius / size;
        const yRel = (2/3) + (Math.sin(this.angle) * radius / (size * 2));

        return { x, yRel };
    }
};

// Background Environment Entities (Sparkles & Clouds)
for (let i = 0; i < 100; i++) {
    const initZ = Math.random();
    entities.push({
        type: 'sparkle',
        x: getRandomFullSpanX(),
        yRel: Math.random(),
        z: initZ,
        size: 10 + Math.random() * 16,
        speed: SPARKLE_SPEED
    });
}

for (let i = 0; i < 100; i++) {
    const initZ = Math.random();
    entities.push({
        type: 'cloud',
        x: getRandomFullSpanX() * 3,
        yRel: 1.3 + Math.random() * 0.5,
        z: initZ,
        size: (120 + Math.random() * 100) * 9,
        speed: CLOUD_SPEED
    });
}

function resetEntity(ent) {
    ent.z = 0.0;
    if (ent.type === 'sparkle') {
        ent.x = getRandomFullSpanX();
        ent.yRel = Math.random();
        ent.size = 10 + Math.random() * 16;
    } else if (ent.type === 'cloud') {
        ent.x = getRandomFullSpanX() * 3;
        ent.yRel = 1.3 + Math.random() * 0.5;
        ent.size = (120 + Math.random() * 100) * 9;
    }
}

// --- RENDER FUNCTIONS ---
function renderWireframeBox() {
    const { size, zBack, zFront } = projection.getCubeParams();
    
    const backVertices = [
        {x: -size, y: -size, z: zBack},
        {x:  size, y: -size, z: zBack},
        {x:  size, y:  size, z: zBack},
        {x: -size, y:  size, z: zBack}
    ];
    
    const frontVertices = [
        {x: -size, y: -size, z: zFront},
        {x:  size, y: -size, z: zFront},
        {x:  size, y:  size, z: zFront},
        {x: -size, y:  size, z: zFront}
    ];

    const projBack = backVertices.map(v => projection.project({ x: v.x / size, yRel: 0.5 + v.y / (size * 2), z: (zBack - v.z) / (zBack - zFront) }));
    const projFront = frontVertices.map(v => projection.project({ x: v.x / size, yRel: 0.5 + v.y / (size * 2), z: (zBack - v.z) / (zBack - zFront) }));

    ctx.strokeStyle = '#00a8ff';
    ctx.lineWidth = 2;

    ctx.beginPath();
    projBack.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    projFront.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(projBack[i].x, projBack[i].y);
        ctx.lineTo(projFront[i].x, projFront[i].y);
        ctx.stroke();
    }
}

function renderSpawnerIndicator() {
    const pos = spawner.getPos();
    const p = projection.project({ x: pos.x, yRel: pos.yRel, z: 0.0 });

    ctx.strokeStyle = '#ff00ee';
    ctx.fillStyle = 'rgba(255, 0, 238, 0.2)';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 14 * p.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x - 10 * p.scale, p.y);
    ctx.lineTo(p.x + 10 * p.scale, p.y);
    ctx.moveTo(p.x, p.y - 10 * p.scale);
    ctx.lineTo(p.x, p.y + 10 * p.scale);
    ctx.stroke();
}

function update(dt, timestamp) {
    // Accumulate time
    gameTime += dt;
    // Accumulate distance smoothly at ~10 meters per second
    gameDistance += 10 * dt;

    // 1. Move circular spawner on back face
    spawner.angle += SPAWNER_SPEED * dt;
    spawner.timer += dt;

    // 2. Spawn individual items at even time intervals exactly at spawner position & height
    if (spawner.timer >= SPAWN_INTERVAL) {
        spawner.timer -= SPAWN_INTERVAL;
        const pos = spawner.getPos();

        const isStar = Math.random() < (10 / 11);

        if (isStar) {
            entities.push({
                type: 'star',
                x: pos.x,
                yRel: pos.yRel,
                z: 0.0,
                size: FIXED_STAR_SIZE,
                speed: STAR_SPEED
            });
        } else {
            entities.push({
                type: 'gate',
                x: pos.x,
                yRel: pos.yRel,
                z: 0.0,
                size: 60,
                speed: GATE_SPEED
            });
        }
    }

    // 3. Update existing entities & filter offscreen items
    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        ent.z += ent.speed * dt;

        if (ent.z >= 0) {
            const p = projection.project(ent);
            let isOffScreen = false;

            if (ent.type === 'star' || ent.type === 'gate') {
                const drawSize = ent.size * p.scale;
                const padding = 100;
                const top = p.y - (drawSize * 0.5);
                const bottom = p.y + (drawSize * 0.5);
                const left = p.x - (drawSize * 0.5);
                const right = p.x + (drawSize * 0.5);

                isOffScreen = (ent.z >= 1.0) || (top > canvas.height + padding) || (bottom < -padding) || (right < -padding) || (left > canvas.width + padding);
            } else if (ent.type === 'sparkle' || ent.type === 'cloud') {
                const drawSize = ent.size * p.scale;
                const drawH = ent.type === 'cloud' ? drawSize * 0.5 : drawSize;
                const top = p.y - drawH / 2;
                const bottom = p.y + drawH / 2;
                const left = p.x - drawSize / 2;
                const right = p.x + drawSize / 2;

                isOffScreen = (top > canvas.height) || (bottom < 0) || (right < 0) || (left > canvas.width) || (ent.z >= 1.0);
            }

            if (isOffScreen) {
                if (ent.type === 'star' || ent.type === 'gate') {
                    entities.splice(i, 1);
                } else {
                    resetEntity(ent);
                }
            }
        }
    }
}

function render(timestamp) {
    cloudCtx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);

    entities.sort((a, b) => projection.project(b).currentZ - projection.project(a).currentZ);

    entities.forEach(ent => {
        if (ent.z < 0) return;

        const p = projection.project(ent);

        let bx = 0, by = 0, bw = 0, bh = 0;
        
        let targetCtx = ctx;
        if (ent.type === 'cloud') {
            targetCtx = cloudCtx;
        } else if (ent.type === 'sparkle') {
            targetCtx = sparkleCtx;
        }

        if (ent.type === 'star' || ent.type === 'gate') {
            const drawSize = ent.size * p.scale;
            bw = drawSize;
            bh = drawSize;
            bx = p.x - drawSize / 2;
            by = p.y - drawSize / 2;

        } else if (ent.type === 'sparkle' || ent.type === 'cloud') {
            const drawSize = ent.size * p.scale;
            bw = drawSize;
            bh = ent.type === 'cloud' ? drawSize * 0.5 : drawSize;
            bx = p.x - bw / 2;
            by = p.y - bh / 2;
        }

        if (ent.type === 'cloud') {
            targetCtx.save();
            targetCtx.globalAlpha = Math.min(1.0, Math.max(0.0, ent.z));
        }

        const img = ASSETS[ent.type];
        if (img && img.complete && img.naturalWidth !== 0) {
            targetCtx.drawImage(img, bx, by, bw, bh);
        } else if (ent.type === 'cloud') {
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            targetCtx.beginPath();
            targetCtx.ellipse(p.x, p.y, bw / 2, bh / 2, 0, 0, Math.PI * 2);
            targetCtx.fill();
        }

        if (ent.type === 'cloud') {
            targetCtx.restore();
        }

        if (debugMode) {
            let debugColor = '#ff0055';
            if (ent.type === 'sparkle') debugColor = '#00ffcc';
            if (ent.type === 'cloud') debugColor = '#ffaa00';
            if (ent.type === 'gate') debugColor = '#00ff00';

            targetCtx.strokeStyle = debugColor;
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(bx, by, bw, bh);
        }
    });

    if (debugMode) {
        renderWireframeBox();
        renderSpawnerIndicator();
    }
}

// --- MAIN LOOP ---
let lastTime = 0;
let frameCount = 0;
let lastFpsUpdate = 0;
let isPaused = false;

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        isPaused = true;
    } else {
        isPaused = false;
        lastTime = performance.now();
    }
});

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function loop(timestamp) {
    if (!isPaused) {
        let dt = (timestamp - lastTime) / 1000 || 0;
        lastTime = timestamp;

        if (dt > 0.1) dt = 0;

        update(dt, timestamp);
        
        frameCount++;
        
        // Update the DOM text content every frame for real-time floating-point smoothness
        const fps = Math.round((frameCount * 1000) / (timestamp - (lastFpsUpdate || timestamp)));
        const formattedTime = formatTime(gameTime);
        const formattedDist = gameDistance.toFixed(0);
        
        const displayFps = (timestamp - lastFpsUpdate >= 500) ? fps : (window.lastKnownFps || 60);
        if (timestamp - lastFpsUpdate >= 500) {
            window.lastKnownFps = fps;
            frameCount = 0;
            lastFpsUpdate = timestamp;
        }

        fpsElem.textContent = `FPS: ${displayFps} | Entities: ${entities.length} | Time: ${formattedTime} | Dist: ${formattedDist}m`;

        render(timestamp);
    }

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
