<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assets</title>
  <style>
body {
  margin: 0;
  min-height: 100vh;
  /* Generates a 2x2 grid pattern */
  background: repeating-conic-gradient(#808080 0% 25%, #e0e0e0 0% 50%) 0 0 / 40px 40px;
}

.star { filter: drop-shadow(0 0 8px rgba(255, 220, 30, 0.9)); }

.rainbow {
-webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 90%);
mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 90%);
}

.cloud { /*filter: blur(1px);*/ }

/* https://angel-rs.github.io/css-color-filter-generator/ */
.blue-cloud { filter: brightness(0) saturate(100%) invert(97%) sepia(2%) saturate(2094%) hue-rotate(166deg) brightness(97%) contrast(99%) /*blur(1px);*/}
  </style>
</head>
<body>
  <center>
    <img src="assets/rainbow.svg" width="700" height="400" />
    <img src="assets/rainbow.svg" width="700" height="400" class="rainbow" />
    <br />
    <img src="assets/cloud.svg" width="400" height="200" />
    <img src="assets/cloud.svg" width="400" height="200" class="cloud" />
    <img src="assets/cloud.svg" width="400" height="200" class="blue-cloud" />
    <br />
    <img src="assets/star.svg" width="140" height="140" />
    <img src="assets/star.svg" width="140" height="140" class="star" />
  </center>
</body>
</html>
