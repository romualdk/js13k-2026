
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rainbow Runner — Canvas</title>
<meta name="description" content="Unicorn running minigame rendered entirely with HTML Canvas.">
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #bff3f8;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }

  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Rainbow Runner"></canvas>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Canvas setup
  // ---------------------------------------------------------------------------

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", {
    alpha: false,
    desynchronized: true
  });

  // Cap DPR to avoid rendering a huge number of physical pixels on high-DPI phones.
  let dpr = 1;
  let W = 0;
  let H = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);

    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    // From here on all drawing uses CSS-pixel coordinates.
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ---------------------------------------------------------------------------
  // Assets
  // ---------------------------------------------------------------------------

  const assets = {};

  function loadImage(key, src) {
    const img = new Image();
    img.decoding = "async";
    img.src = src;
    assets[key] = img;
    return img;
  }

  loadImage("unicornBack", "assets/unicorn-back.svg");
  loadImage("unicornSide", "assets/unicorn-side.svg");
  loadImage("star", "assets/star.svg");
  loadImage("gate", "assets/gate.svg");
  loadImage("rainbow", "assets/rainbow.svg");

  // ---------------------------------------------------------------------------
  // Game state — gameplay rules intentionally match the original DOM version.
  // ---------------------------------------------------------------------------

  const laneColors = ["yellow", "blue", "red"];
  const gateColors = ["yellow", "blue", "red"];

  let currentLane = 1;
  let distance = 0;
  let points = 0;
  let health = 2;
  let nextHealthThreshold = 50;

  let spawnTimer = 0;
  const SPAWN_EVERY_FRAMES = 45;
  const GAME_SPEED = 0.0105; // depth units / 60 fps

  let lastTime = performance.now();
  let gameOverFlash = 0;
  let hitFlash = 0;

  // One lightweight JS object per active gameplay entity.
  // No DOM elements are created/destroyed during gameplay.
  const entities = [];

  // ---------------------------------------------------------------------------
  // Geometry / perspective
  // ---------------------------------------------------------------------------

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(t) {
    return t * t * (3 - 2 * t);
  }

  function roadGeometry() {
    const horizonY = H * 0.29;
    const bottomY = H * 1.08;
    const centerX = W * 0.5;

    // Narrow at the horizon, almost full width at the bottom.
    const topHalf = Math.min(W * 0.055, 65);
    const bottomHalf = W * 0.485;

    return { horizonY, bottomY, centerX, topHalf, bottomHalf };
  }

  function roadAtT(t) {
    const g = roadGeometry();
    t = clamp01(t);
    // Slight exponential perspective: objects accelerate visually as they approach.
    const p = Math.pow(t, 1.42);
    const y = lerp(g.horizonY, g.bottomY, p);
    const half = lerp(g.topHalf, g.bottomHalf, smoothstep(t));
    return {
      y,
      left: g.centerX - half,
      right: g.centerX + half,
      center: g.centerX
    };
  }

  function laneCenterX(lane, t) {
    const r = roadAtT(t);
    const u = (lane + 0.5) / 3;
    return lerp(r.left, r.right, u);
  }

  function laneEdges(lane, t) {
    const r = roadAtT(t);
    const x1 = lerp(r.left, r.right, lane / 3);
    const x2 = lerp(r.left, r.right, (lane + 1) / 3);
    return { x1, x2, width: x2 - x1 };
  }

  function playerCenterX() {
    // Matches the original approximate lane centers: ~15%, 50%, ~85%.
    return W * [0.166, 0.5, 0.834][currentLane];
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------

  function movePlayer(direction) {
    const prevLane = currentLane;

    if (direction < 0 && currentLane > 0) currentLane--;
    if (direction > 0 && currentLane < 2) currentLane++;

    return prevLane !== currentLane;
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
      movePlayer(-1);
    } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
      movePlayer(1);
    }
  }, { passive: true });

  canvas.addEventListener("pointerdown", (e) => {
    movePlayer(e.clientX < W * 0.5 ? -1 : 1);
  }, { passive: true });

  // ---------------------------------------------------------------------------
  // Spawning
  // ---------------------------------------------------------------------------

  function spawnEntity() {
    const lane = (Math.random() * 3) | 0;
    const isGate = Math.random() < 0.45;

    entities.push({
      lane,
      z: 0,
      type: isGate ? "gate" : "star",
      color: isGate ? gateColors[(Math.random() * 3) | 0] : null,
      hasCollided: false,
      phase: Math.random() * Math.PI * 2
    });
  }

  // ---------------------------------------------------------------------------
  // Drawing primitives
  // ---------------------------------------------------------------------------

  function roundedRect(x, y, w, h, r) {
    const rr = Math.min(r, w * 0.5, h * 0.5);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function starPath(cx, cy, outerR, innerR, points = 5) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const a = -Math.PI / 2 + i * Math.PI / points;
      const r = i % 2 === 0 ? outerR : innerR;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // ---------------------------------------------------------------------------
  // Background
  // ---------------------------------------------------------------------------

  function drawBackground(time) {
    // Sky gradient.
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#82e7f1");
    sky.addColorStop(0.42, "#f6b9e5");
    sky.addColorStop(0.72, "#ffe7df");
    sky.addColorStop(1, "#fff3ad");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Soft pastel haze around the horizon.
    const haze = ctx.createRadialGradient(W * 0.5, H * 0.53, 0, W * 0.5, H * 0.53, W * 0.55);
    haze.addColorStop(0, "rgba(255,255,255,0.72)");
    haze.addColorStop(0.55, "rgba(255,250,255,0.20)");
    haze.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);

    drawRainbow();

    // Clouds are deliberately simple — cheap to draw and stable at 60 fps.
    drawCloud(W * 0.15, H * 0.20, W * 0.12, H * 0.035);
    drawCloud(W * 0.84, H * 0.20, W * 0.12, H * 0.035);
    drawCloud(W * 0.18, H * 0.32, W * 0.16, H * 0.035);
    drawCloud(W * 0.81, H * 0.34, W * 0.14, H * 0.034);
    drawCloud(W * 0.08, H * 0.54, W * 0.18, H * 0.055);
    drawCloud(W * 0.93, H * 0.52, W * 0.18, H * 0.055);

    // A few static-ish sparkles. Their alpha changes slightly without
    // allocating objects.
    const twinkle = 0.55 + Math.sin(time * 0.0013) * 0.15;
    drawSparkle(W * 0.29, H * 0.115, 7, twinkle);
    drawSparkle(W * 0.56, H * 0.105, 5, 0.9);
    drawSparkle(W * 0.08, H * 0.33, 5, 0.8);
    drawSparkle(W * 0.86, H * 0.30, 6, 0.85);
  }

  function drawCloud(cx, cy, w, h) {
    const r = h * 0.55;
    ctx.save();

    // Small soft shadow.
    ctx.fillStyle = "rgba(102,119,155,0.10)";
    ctx.beginPath();
    ctx.ellipse(cx, cy + h * 0.30, w * 0.47, h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx - w * 0.27, cy + h * 0.10, r * 0.95, r * 0.82, 0, 0, Math.PI * 2);
    ctx.ellipse(cx - w * 0.08, cy - h * 0.04, r * 1.16, r * 1.00, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + w * 0.14, cy + h * 0.04, r * 1.10, r * 0.90, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + w * 0.33, cy + h * 0.12, r * 0.80, r * 0.68, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "rgba(206,229,241,0.55)";
    ctx.beginPath();
    ctx.ellipse(cx - w * 0.05, cy + h * 0.22, w * 0.31, h * 0.25, 0, 0, Math.PI * 2);
    ctx.ellipse(cx + w * 0.24, cy + h * 0.20, w * 0.24, h * 0.21, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawSparkle(x, y, r, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(x, y - r);
    ctx.lineTo(x + r * 0.27, y - r * 0.27);
    ctx.lineTo(x + r, y);
    ctx.lineTo(x + r * 0.27, y + r * 0.27);
    ctx.lineTo(x, y + r);
    ctx.lineTo(x - r * 0.27, y + r * 0.27);
    ctx.lineTo(x - r, y);
    ctx.lineTo(x - r * 0.27, y - r * 0.27);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawRainbow() {
    const img = assets.rainbow;
    if (!img.complete || !img.naturalWidth) return;

    // The original game used rainbow.svg as the decorative arc. Draw the same
    // asset directly to Canvas instead of recreating it from CSS/DOM.
    const targetW = Math.min(W * 1.90, 1100);
    const targetH = targetW * (img.naturalHeight / img.naturalWidth);
    const x = (W - targetW) * 0.5;
    const y = H * 0.055;

    ctx.save();
    ctx.globalAlpha = 0.86;
    ctx.drawImage(img, x, y, targetW, targetH);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Road
  // ---------------------------------------------------------------------------

  function drawRoad() {
    const g = roadGeometry();

    // Road shadow / outer glow.
    const outer = ctx.createLinearGradient(0, g.horizonY, 0, H);
    outer.addColorStop(0, "rgba(90,63,160,0)");
    outer.addColorStop(0.45, "rgba(112,82,170,0.13)");
    outer.addColorStop(1, "rgba(80,50,120,0.08)");

    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.moveTo(g.centerX - g.topHalf, g.horizonY);
    ctx.lineTo(g.centerX + g.topHalf, g.horizonY);
    ctx.lineTo(g.centerX + g.bottomHalf, H);
    ctx.lineTo(g.centerX - g.bottomHalf, H);
    ctx.closePath();
    ctx.fill();

    const laneColorsLocal = [
      ["#ffef00", "#ff9d00", "#ff4c08", "rgba(255,235,0,0.75)"],
      ["#19efff", "#008ede", "#383ac7", "rgba(35,234,255,0.80)"],
      ["#ffd2e1", "#ff397f", "#df0750", "rgba(255,207,226,0.80)"]
    ];

    for (let lane = 0; lane < 3; lane++) {
      const top = laneEdges(lane, 0);
      const bottom = laneEdges(lane, 1);

      const grad = ctx.createLinearGradient(0, g.horizonY, 0, H);
      grad.addColorStop(0, laneColorsLocal[lane][1]);
      grad.addColorStop(0.42, laneColorsLocal[lane][1]);
      grad.addColorStop(1, laneColorsLocal[lane][2]);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(top.x1, g.horizonY);
      ctx.lineTo(top.x2, g.horizonY);
      ctx.lineTo(bottom.x2, H);
      ctx.lineTo(bottom.x1, H);
      ctx.closePath();
      ctx.fill();

      // Inner luminous lane borders.
      const borderWidth = Math.max(2, W * 0.004);
      ctx.strokeStyle = "#f9feff";
      ctx.lineWidth = borderWidth;
      ctx.globalAlpha = 0.80;

      ctx.beginPath();
      ctx.moveTo(top.x1, g.horizonY);
      ctx.lineTo(bottom.x1, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(top.x2, g.horizonY);
      ctx.lineTo(bottom.x2, H);
      ctx.stroke();

      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = laneColorsLocal[lane][3];
      ctx.lineWidth = borderWidth * 2.5;

      ctx.beginPath();
      ctx.moveTo(top.x1, g.horizonY);
      ctx.lineTo(bottom.x1, H);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(top.x2, g.horizonY);
      ctx.lineTo(bottom.x2, H);
      ctx.stroke();

      ctx.globalAlpha = 1;
    }

    // Small horizon highlight.
    const horizonGlow = ctx.createLinearGradient(0, g.horizonY - 30, 0, g.horizonY + 100);
    horizonGlow.addColorStop(0, "rgba(255,255,255,0)");
    horizonGlow.addColorStop(0.5, "rgba(255,255,255,0.55)");
    horizonGlow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(g.centerX - W * 0.18, g.horizonY - 30, W * 0.36, 140);
  }

  // ---------------------------------------------------------------------------
  // Entities
  // ---------------------------------------------------------------------------

  function projectEntity(ent) {
    const t = clamp01(ent.z);
    const road = roadAtT(t);

    // Slightly above the road line, like the original floating objects.
    const y = road.y;
    const lane = laneEdges(ent.lane, t);
    const x = (lane.x1 + lane.x2) * 0.5;
    const laneWidth = lane.width;

    return { t, x, y, laneWidth };
  }

  function drawStarEntity(ent, time) {
    const p = projectEntity(ent);
    const bob = Math.sin(time * 0.005 + ent.phase) * (3 + p.t * 5);
    const img = assets.star;

    // Match the original SVG-based entity proportions while scaling naturally
    // with perspective.
    const size = lerp(12, Math.max(25, p.laneWidth * 0.22), Math.pow(p.t, 0.65));
    const drawW = size;
    const drawH = img.naturalWidth && img.naturalHeight
      ? drawW * (img.naturalHeight / img.naturalWidth)
      : drawW;
    const drawX = p.x - drawW * 0.5;
    const drawY = p.y - drawH * 0.78 + bob;

    // Ground shadow is kept as a tiny Canvas primitive; the actual star artwork
    // comes directly from the original assets/star.svg.
    ctx.save();
    ctx.globalAlpha = lerp(0.20, 0.38, p.t);
    ctx.fillStyle = "#5b2876";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + size * 0.56, size * 0.52, size * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (img.complete && img.naturalWidth) {
      // Cheap glow behind the original SVG asset.
      ctx.save();
      ctx.globalAlpha = 0.16 + p.t * 0.10;
      ctx.fillStyle = "#fff06a";
      ctx.beginPath();
      ctx.arc(p.x, drawY + drawH * 0.5, size * 0.72, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.globalAlpha = 0.96;
      ctx.drawImage(img, drawX, drawY, drawW, drawH);
      ctx.restore();
    } else {
      // Fallback only while the source SVG is loading.
      ctx.save();
      ctx.fillStyle = "#fff25e";
      ctx.strokeStyle = "#f1b82c";
      ctx.lineWidth = Math.max(1.2, size * 0.07);
      starPath(p.x, p.y - size * 0.25 + bob, size, size * 0.46);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawGateEntity(ent) {
    const p = projectEntity(ent);
    const img = assets.gate;

    // Original gate.svg is scaled with perspective rather than transformed by
    // CSS. This preserves the original artwork while eliminating CSS 3D.
    const scale = lerp(0.08, 1.0, Math.pow(p.t, 0.82));
    const gateW = Math.max(24, p.laneWidth * 1.12 * scale);
    const gateH = img.naturalWidth && img.naturalHeight
      ? gateW * (img.naturalHeight / img.naturalWidth)
      : gateW;
    const x = p.x - gateW * 0.5;
    const y = p.y - gateH;

    // Keep a compact floor shadow rather than creating another DOM image.
    ctx.save();
    ctx.fillStyle = "rgba(65,30,80,0.22)";
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + 5, gateW * 0.35, gateW * 0.08, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    if (!img.complete || !img.naturalWidth) {
      // Fallback gate while the SVG is loading.
      ctx.save();
      ctx.strokeStyle = ent.color === "yellow" ? "#ffd629" : ent.color === "blue" ? "#42d9ff" : "#ff3c70";
      ctx.lineWidth = Math.max(3, gateW * 0.06);
      drawGatePath(p.x, p.y, gateW, gateH);
      ctx.restore();
      return;
    }

    const tint = ent.color === "yellow"
      ? "sepia(1) saturate(5) hue-rotate(350deg) brightness(1.15)"
      : ent.color === "blue"
        ? "hue-rotate(155deg) saturate(1.8) brightness(1.10)"
        : "hue-rotate(305deg) saturate(1.65) brightness(1.10)";

    // Main original gate artwork. Canvas filters are applied only for the
    // single gate draw call and do not involve DOM layout or CSS perspective.
    ctx.save();
    ctx.filter = tint;
    ctx.globalAlpha = 1;
    ctx.drawImage(img, x, y, gateW, gateH);
    ctx.restore();
  }

  function drawGatePath(cx, baseY, w, h) {
    const half = w * 0.42;
    const leg = h * 0.78;
    const curveY = baseY - leg;
    const top = baseY - h;
    const radius = half;

    ctx.beginPath();
    ctx.moveTo(cx - half, baseY);
    ctx.lineTo(cx - half, curveY + radius * 0.15);
    ctx.quadraticCurveTo(cx - half, top, cx, top);
    ctx.quadraticCurveTo(cx + half, top, cx + half, curveY + radius * 0.15);
    ctx.lineTo(cx + half, baseY);
    ctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // Player
  // ---------------------------------------------------------------------------

  function drawPlayer(time) {
    const img = currentLane === 1 ? assets.unicornBack : assets.unicornSide;
    const x = playerCenterX();
    const baseY = H - Math.max(95, H * 0.12);
    const bob = Math.sin(time * 0.010) * 8;

    const playerH = Math.min(H * 0.34, 270);
    const playerW = playerH * (145 / 204);

    // Shadow below the unicorn.
    ctx.save();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = "#4e1e70";
    ctx.beginPath();
    ctx.ellipse(x, baseY + playerH * 0.06, playerW * 0.42, playerH * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Small cyan motion ring.
    const ringR = playerW * 0.43;
    ctx.save();
    ctx.strokeStyle = "rgba(70,241,255,0.75)";
    ctx.lineWidth = Math.max(2, W * 0.003);
    ctx.beginPath();
    ctx.arc(x, baseY - playerH * 0.22 + bob, ringR, Math.PI * 0.17, Math.PI * 1.06);
    ctx.stroke();
    ctx.globalAlpha = 0.35;
    ctx.beginPath();
    ctx.arc(x, baseY - playerH * 0.22 + bob, ringR * 1.10, Math.PI * 1.12, Math.PI * 1.78);
    ctx.stroke();
    ctx.restore();

    if (!img.complete || !img.naturalWidth) {
      // Fallback silhouette while an SVG is loading.
      drawFallbackUnicorn(x, baseY - playerH * 0.92 + bob, playerW, playerH);
      return;
    }

    ctx.save();
    if (currentLane === 2) {
      ctx.translate(x, 0);
      ctx.scale(-1, 1);
      ctx.translate(-x, 0);
    }

    // Flash red on a wrong gate hit.
    if (hitFlash > 0) {
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
    }

    ctx.drawImage(
      img,
      x - playerW * 0.5,
      baseY - playerH + bob,
      playerW,
      playerH
    );

    ctx.restore();

    if (hitFlash > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.28, hitFlash * 0.45);
      ctx.fillStyle = "#ff2b54";
      ctx.beginPath();
      ctx.arc(x, baseY - playerH * 0.5 + bob, playerW * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFallbackUnicorn(x, y, w, h) {
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#5e2d79";
    ctx.lineWidth = Math.max(2, w * 0.025);

    ctx.beginPath();
    ctx.ellipse(x, y + h * 0.48, w * 0.28, h * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x + w * 0.10, y + h * 0.18, w * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + w * 0.14, y + h * 0.02);
    ctx.lineTo(x + w * 0.22, y - h * 0.10);
    ctx.lineTo(x + w * 0.25, y + h * 0.06);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // HUD
  // ---------------------------------------------------------------------------

  function drawHud() {
    const barW = Math.min(W * 0.82, 540);
    const barH = Math.max(54, Math.min(76, H * 0.09));
    const x = (W - barW) * 0.5;
    const y = 12;

    ctx.save();

    // Outer purple frame.
    roundedRect(x, y, barW, barH, 22);
    ctx.fillStyle = "#5b2c82";
    ctx.fill();

    // Inner plate.
    roundedRect(x + 5, y + 5, barW - 10, barH - 10, 18);
    const plate = ctx.createLinearGradient(0, y, 0, y + barH);
    plate.addColorStop(0, "#dba5ef");
    plate.addColorStop(1, "#8b48a9");
    ctx.fillStyle = plate;
    ctx.fill();

    // Star icon.
    const iconR = Math.min(barH * 0.24, 20);
    const iconX = x + barW * 0.10;
    const iconY = y + barH * 0.50;

    ctx.fillStyle = "#ffe952";
    ctx.strokeStyle = "#a75a3c";
    ctx.lineWidth = 2;
    starPath(iconX, iconY, iconR, iconR * 0.44);
    ctx.fill();
    ctx.stroke();

    const fs = Math.max(18, Math.min(34, W * 0.042));
    ctx.font = `900 ${fs}px "Segoe UI", Tahoma, sans-serif`;
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = Math.max(3, fs * 0.20);
    ctx.strokeText(`DISTANCE: ${Math.floor(distance)}m`, x + barW * 0.18, iconY);

    ctx.fillStyle = "#4a154b";
    ctx.fillText(`DISTANCE: ${Math.floor(distance)}m`, x + barW * 0.18, iconY);

    // Secondary information in a compact line.
    const smallFs = Math.max(12, Math.min(18, W * 0.021));
    ctx.font = `800 ${smallFs}px "Segoe UI", Tahoma, sans-serif`;
    ctx.textAlign = "right";
    ctx.fillStyle = "#4a154b";
    ctx.globalAlpha = 0.92;

    ctx.fillText(`POINTS ${points}   •   HEALTH ${health}`, x + barW - 18, y + barH - 13);
    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Collision / scoring
  // ---------------------------------------------------------------------------

  function updateEntities(dt) {
    for (let i = entities.length - 1; i >= 0; i--) {
      const ent = entities[i];

      ent.z += GAME_SPEED * dt;

      if (ent.z > 1.12) {
        entities.splice(i, 1);
        continue;
      }

      // Equivalent to the original "near player" collision band.
      const isColliding =
        !ent.hasCollided &&
        ent.z > 0.90 &&
        ent.z < 1.035 &&
        ent.lane === currentLane;

      if (!isColliding) continue;

      ent.hasCollided = true;

      if (ent.type === "gate") {
        const activeColor = laneColors[currentLane];

        if (ent.color === activeColor) {
          points += 5;
        } else {
          points -= 10;
          hitFlash = 1.0;
        }
      } else {
        points += 1;
        // Star disappears immediately after collection.
        entities.splice(i, 1);
      }

      if (points <= 0) {
        points = 0;
        health--;

        if (health <= 0) {
          resetGame();
          return;
        }
      } else if (points >= nextHealthThreshold) {
        health++;
        nextHealthThreshold += 50;
      }
    }
  }

  function resetGame() {
    distance = 0;
    points = 0;
    health = 2;
    nextHealthThreshold = 50;
    entities.length = 0;
    gameOverFlash = 0.35;
  }

  // ---------------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------------

  function frame(now) {
    const dt = Math.min(2.0, (now - lastTime) / 16.6667);
    lastTime = now;

    distance += 0.1 * dt;
    spawnTimer += dt;

    if (spawnTimer >= SPAWN_EVERY_FRAMES) {
      spawnEntity();
      spawnTimer -= SPAWN_EVERY_FRAMES;
    }

    hitFlash = Math.max(0, hitFlash - dt * 0.055);
    gameOverFlash = Math.max(0, gameOverFlash - dt * 0.02);

    updateEntities(dt);

    // ----- Render -----
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawBackground(now);
    drawRoad();

    // Back-to-front draw order. Sort only by depth value and only among the
    // usually small entity array. There are no DOM layout/paint operations.
    entities.sort((a, b) => a.z - b.z);

    for (let i = 0; i < entities.length; i++) {
      const ent = entities[i];
      if (ent.type === "star") drawStarEntity(ent, now);
      else drawGateEntity(ent);
    }

    drawPlayer(now);
    drawHud();

    if (gameOverFlash > 0) {
      ctx.fillStyle = `rgba(255,90,140,${gameOverFlash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    requestAnimationFrame(frame);
  }

  // Start.
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
