<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Runner</title>
    <meta name="description" content="Unicorn running minigame! Collect stars and race down the rainbow road.">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #fff2f9; 
            background-image: 
                radial-gradient(circle at top left, #ff9de2 0%, transparent 60%),
                radial-gradient(circle at top right, #72f5ff 0%, transparent 60%),
                radial-gradient(circle at bottom right, #ffe17d 0%, transparent 60%),
                radial-gradient(circle at bottom left, #ffb3c6 0%, transparent 60%); 
        }
        
        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        #cloudCanvas { z-index: 1; }
        #gameCanvas { z-index: 2; }
        #sparkleCanvas { z-index: 3; pointer-events: none; }

        /* --- GAME HUD --- */
        #gameHUD {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 48px;
            background: rgba(30, 20, 40, 0.85);
            padding: 10px 48px;
            border-radius: 40px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 182, 215, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: #ff9de2;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(8px);
            align-items: center;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hud-icon {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
            margin-top: -4px;
            margin-bottom: -4px;
        }

        .hud-icon.rainbow-left-half {
            width: 80px;
            height: 80px;
            object-position: left;
            clip-path: inset(0 50% 0 0);
            margin-right: -30px;
            margin-top: -6px;
            margin-bottom: -6px;
        }

        #fpsCounter {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ffcc;
            font-family: monospace;
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 4px;
            pointer-events: none;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameHUD">
    <div class="hud-item"><img src="assets/rainbow.svg" class="hud-icon rainbow-left-half" alt="Rainbows"><span id="hudRainbows">0</span></div>
    <div class="hud-item"><img src="assets/unicorn-side.svg" class="hud-icon" alt="Distance"><span id="hudDist">0</span>m</div>
    <div class="hud-item"><img src="assets/star.svg" class="hud-icon" alt="Stars"><span id="hudStars">0</span></div>
</div>

<div id="fpsCounter">FPS: 60 | Speed: 1.00x | Entities: 0 | Time: 00:00 | Dist: 0.00m | Stars: 0 | Rainbows: 0</div>
<div class="canvas-container">
    <canvas id="cloudCanvas"></canvas>
    <canvas id="gameCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>
</div>

<script>
// --- CANVAS SETUP ---
const cloudCanvas = document.getElementById('cloudCanvas');
const cloudCtx = cloudCanvas.getContext('2d');

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const sparkleCanvas = document.getElementById('sparkleCanvas');
const sparkleCtx = sparkleCanvas.getContext('2d');

const fpsElem = document.getElementById('fpsCounter');

// --- HUD ELEMENTS ---
const hudStarsElem = document.getElementById('hudStars');
const hudDistElem = document.getElementById('hudDist');
const hudRainbowsElem = document.getElementById('hudRainbows');

// --- METRICS & SPEED TRACKING ---
let gameTime = 0; 
let gameDistance = 0; 
let collectedStars = 0;
let passedRainbows = 0;
let globalSpeedMultiplier = 1.0;
let lastSpawnedGateType = null;

// --- CAMERA SHAKE STATE ---
let shakeDuration = 0;
let shakeIntensity = 0;
let shakeOffsetX = 0;
let shakeOffsetY = 0;

function triggerCameraShake(intensity = 20, duration = 0.4) {
    shakeIntensity = intensity;
    shakeDuration = duration;
}

// --- PLAYER STATE ---
const player = {
    lane: 1,        // 0: left, 1: middle, 2: right
    currentX: 0,    // Interpolated world X position
    size: 220,      // Base height reference for the unicorn
    facing: 'right', // 'left' or 'right'
    yOffset: 0,     // Vertical offset for jumping
    yVelocity: 0    // Jump vertical velocity
};

// --- LAYER VISIBILITY & CONTROLS ---
let debugMode = false;
let showCloudLayer = true;
let showMainLayer = true;
let showSparkleLayer = true;

window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (player.lane > 0) {
            const oldLane = player.lane;
            player.lane--;
            if (oldLane === 2) {
                player.facing = 'left';
            } else if (oldLane === 1) {
                player.facing = 'right';
            }
        }
    }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (player.lane < 2) {
            const oldLane = player.lane;
            player.lane++;
            if (oldLane === 0) {
                player.facing = 'right';
            } else if (oldLane === 1) {
                player.facing = 'left';
            }
        }
    }
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.key === ' ') {
        if (player.yOffset === 0) {
            player.yVelocity = 650; // Jump initial velocity
        }
    }
    if (e.key === '`' || e.key === '~') {
        debugMode = !debugMode;
        fpsElem.style.display = debugMode ? 'block' : 'none';
    }
    if (e.key === '1') {
        showCloudLayer = !showCloudLayer;
        cloudCanvas.style.display = showCloudLayer ? 'block' : 'none';
    }
    if (e.key === '2') {
        showMainLayer = !showMainLayer;
        canvas.style.display = showMainLayer ? 'block' : 'none';
    }
    if (e.key === '3') {
        showSparkleLayer = !showSparkleLayer;
        sparkleCanvas.style.display = showSparkleLayer ? 'block' : 'none';
    }
});

// --- ASSET PRELOADING WITH INLINE FALLBACKS ---
const DEFAULT_CLOUD_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100"><path fill="%23ffffff" opacity="0.85" d="M30 70 A30 30 0 0 1 60 30 A40 40 0 0 1 130 25 A35 35 0 0 1 170 60 A25 25 0 0 1 150 85 L40 85 A25 25 0 0 1 30 70 Z"/></svg>';
const DEFAULT_UNICORN_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="%23ff006e"/><polygon points="50,10 60,30 40,30" fill="%23ffeb3b"/></svg>';

const ASSETS = {
    star: new Image(),
    sparkle: new Image(),
    gate: new Image(),
    cloud: new Image(),
    rainbow: new Image(),
    unicornSide: new Image()
};

ASSETS.star.src = 'assets/star.svg';
ASSETS.sparkle.src = 'assets/sparkle.svg';
ASSETS.gate.src = 'assets/gate.svg';
ASSETS.cloud.src = 'assets/cloud.svg';
ASSETS.rainbow.src = 'assets/rainbow.svg';
ASSETS.unicornSide.src = 'assets/unicorn-side.svg';

ASSETS.cloud.onerror = () => {
    ASSETS.cloud.src = DEFAULT_CLOUD_SVG;
};

ASSETS.unicornSide.onerror = () => {
    ASSETS.unicornSide.src = DEFAULT_UNICORN_SVG;
};

// --- SPEED & SPAWN CONFIGURATION ---
const STAR_SPEED             = 0.1; 
const SPARKLE_SPEED          = 0.1; 
const GATE_SPEED             = 0.1;
const CLOUD_SPEED            = 0.1;
const RAINBOW_SPEED          = 0.1; 

const SPAWN_INTERVAL         = 0.5; 
const RAINBOW_SPAWN_INTERVAL = 5.0; 
const FIXED_STAR_SIZE        = 130; 

let spawnTimer = 0;
let nextSpawnLaneIndex = 0; 
const spawnLaneSequence = [0, 1, 2, 1];

let rainbowTimer = 0; 

// --- PARTICLE BURST SYSTEM ---
const particles = [];

function createStarBurst(x, y, count = 14, speedMult = 1) {
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + (Math.random() * 0.4 - 0.2);
        const speed = (180 + Math.random() * 220) * speedMult;
        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: (20 + Math.random() * 25) * speedMult,
            alpha: 1.0,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 8,
            life: 1.0,
            decay: (1.8 + Math.random() * 0.8) / speedMult
        });
    }
}

function resize() {
    cloudCanvas.width = window.innerWidth;
    cloudCanvas.height = window.innerHeight;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    sparkleCanvas.width = window.innerWidth;
    sparkleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

function getCloudSize() {
    const multiplier = window.innerWidth < 768 ? 3.5 : 9;
    return (120 + Math.random() * 100) * multiplier;
}

const projection = {
    getCubeParams() {
        const w = canvas.width;
        const h = canvas.height;
        const size = Math.min(w, h) * 0.35;
        
        return {
            size: size,
            zBack: 25000,
            zFront: 150,   
            fov: 400
        };
    },

    project(ent) {
        const { size, zBack, zFront, fov } = this.getCubeParams();
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        const currentZ = zBack - (zBack - zFront) * ent.z;
        const scale = fov / currentZ;

        const worldX = ent.x * size;
        const worldY = (ent.yRel - 0.5) * size * 2;

        return {
            x: worldX * scale + cx,
            y: worldY * scale + cy,
            scale: scale,
            currentZ: currentZ
        };
    }
};

function getRandomFullSpanX() {
    return -2.5 + Math.random() * 5.0;
}

const entities = [];

for (let i = 0; i < 200; i++) {
    const initZ = Math.random();
    entities.push({
        type: 'sparkle',
        x: getRandomFullSpanX(),
        yRel: Math.random(),
        z: initZ,
        size: 10 + Math.random() * 16,
        speed: SPARKLE_SPEED
    });
}

for (let i = 0; i < 100; i++) {
    const initZ = Math.random();
    entities.push({
        type: 'cloud',
        x: getRandomFullSpanX() * 10,
        yRel: 1.5 + Math.random() * 0.5,
        z: initZ,
        size: getCloudSize() * 1.5,
        speed: CLOUD_SPEED
    });
}

function resetEntity(ent) {
    ent.z = 0.0;
    if (ent.type === 'sparkle') {
        ent.x = getRandomFullSpanX();
        ent.yRel = Math.random();
        ent.size = 10 + Math.random() * 16;
    } else if (ent.type === 'cloud') {
        ent.x = getRandomFullSpanX() * 3;
        ent.yRel = 1.3 + Math.random() * 0.5;
        ent.size = getCloudSize();
    }
}

function renderWireframeBox() {
    const { size, zBack, zFront } = projection.getCubeParams();
    
    const backVertices = [
        {x: -size, y: -size, z: zBack},
        {x:  size, y: -size, z: zBack},
        {x:  size, y:  size, z: zBack},
        {x: -size, y:  size, z: zBack}
    ];
    
    const frontVertices = [
        {x: -size, y: -size, z: zFront},
        {x:  size, y: -size, z: zFront},
        {x:  size, y:  size, z: zFront},
        {x: -size, y:  size, z: zFront}
    ];

    const projBack = backVertices.map(v => projection.project({ x: v.x / size, yRel: 0.5 + v.y / (size * 2), z: (zBack - v.z) / (zBack - zFront) }));
    const projFront = frontVertices.map(v => projection.project({ x: v.x / size, yRel: 0.5 + v.y / (size * 2), z: (zBack - v.z) / (zBack - zFront) }));

    ctx.strokeStyle = '#00a8ff';
    ctx.lineWidth = 2;

    ctx.beginPath();
    projBack.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();

    ctx.beginPath();
    projFront.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.stroke();

    for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(projBack[i].x, projBack[i].y);
        ctx.lineTo(projFront[i].x, projFront[i].y);
        ctx.stroke();
    }
}

function renderSpawnerIndicators() {
    const { size } = projection.getCubeParams();
    const numLanes = 3;
    const laneWidth = (size * 2) / numLanes;
    
    const yRel = 0.5 + size / (size * 2);

    for (let i = 0; i < numLanes; i++) {
        const xStart = -size + (i * laneWidth);
        const laneCenterX = (xStart + laneWidth / 2) / size;

        const p = projection.project({ x: laneCenterX, yRel: yRel, z: 0.0 });

        ctx.strokeStyle = '#ff00ee';
        ctx.fillStyle = 'rgba(255, 0, 238, 0.2)';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 14 * p.scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(p.x - 10 * p.scale, p.y);
        ctx.lineTo(p.x + 10 * p.scale, p.y);
        ctx.moveTo(p.x, p.y - 10 * p.scale);
        ctx.lineTo(p.x, p.y + 10 * p.scale);
        ctx.stroke();
    }
}

function getPlayerBoundingBox() {
    const { size } = projection.getCubeParams();
    const numLanes = 3;
    const laneWidth = (size * 2) / numLanes;
    const bottomY = size; 

    const originPoint = projection.project({ x: 0, yRel: 0.5 + bottomY / (size * 2), z: -5.0 });

    const xStart = -size + (player.lane * laneWidth);
    const laneCenterX = (xStart + laneWidth / 2) / size;

    const frontCenter = projection.project({
        x: laneCenterX,
        yRel: 0.5 + bottomY / (size * 2),
        z: 1.0
    });

    const screenY = canvas.height - 40 - player.yOffset;
    const t = (screenY - originPoint.y) / (frontCenter.y - originPoint.y);
    const screenX = originPoint.x + (frontCenter.x - originPoint.x) * t;

    const h = player.size; 
    const bobOffset = player.yOffset === 0 ? Math.sin(gameTime * 14) * 8 : 0; 
    const aspectRatio = 60 / 85; 
    const w = h * aspectRatio;

    const pX = screenX;
    const pY = screenY + bobOffset - (h / 2);

    return {
        x: pX - (w * 0.4),
        y: pY - (h * 0.4),
        width: w * 0.8,
        height: h * 0.8
    };
}

function update(dt, timestamp) {
    gameTime += dt;
    gameDistance += 10 * globalSpeedMultiplier * dt;

    // --- UPDATE JUMP PHYSICS ---
    if (player.yOffset > 0 || player.yVelocity !== 0) {
        player.yVelocity -= 1800 * dt; // Gravity
        player.yOffset += player.yVelocity * dt;
        if (player.yOffset < 0) {
            player.yOffset = 0;
            player.yVelocity = 0;
        }
    }

    // --- UPDATE CAMERA SHAKE ---
    if (shakeDuration > 0) {
        shakeDuration -= dt;
        shakeOffsetX = (Math.random() - 0.5) * 2 * shakeIntensity;
        shakeOffsetY = (Math.random() - 0.5) * 2 * shakeIntensity;
        if (shakeDuration <= 0) {
            shakeOffsetX = 0;
            shakeOffsetY = 0;
        }
    }

    const { size } = projection.getCubeParams();
    const numLanes = 3;
    const laneWidth = (size * 2) / numLanes;
    const xStart = -size + (player.lane * laneWidth);
    const targetLaneX = (xStart + laneWidth / 2) / size;
    player.currentX += (targetLaneX - player.currentX) * 15 * dt;

    spawnTimer += dt;

    // Adjust spawn frequency dynamically with global speed
    const currentSpawnInterval = SPAWN_INTERVAL / globalSpeedMultiplier;
    if (spawnTimer >= currentSpawnInterval) {
        spawnTimer -= currentSpawnInterval;
        
        const laneIndex = spawnLaneSequence[nextSpawnLaneIndex];
        nextSpawnLaneIndex = (nextSpawnLaneIndex + 1) % spawnLaneSequence.length;

        const standardYRel = 0.5 + size / (size * 2);
        const randRoll = Math.random();

        // Adjusted probability weights: Increased star chance, lowered green gate frequency (from 0.15 to 0.08)
        if (randRoll < 0.67) {
            // Spawn Star
            const laneXStart = -size + (laneIndex * laneWidth);
            const laneCenterX = (laneXStart + laneWidth / 2) / size;
            entities.push({
                type: 'star',
                lane: laneIndex,
                x: laneCenterX,
                yRel: standardYRel - 0.08,
                z: 0.0,
                size: FIXED_STAR_SIZE,
                speed: STAR_SPEED,
                collected: false
            });
            lastSpawnedGateType = null; // Reset gate tracking on stars
        } else if (randRoll < 0.92 || lastSpawnedGateType === 'green') {
            // Spawn Red Gate (Single Lane) - forced if the last gate was green
            const laneXStart = -size + (laneIndex * laneWidth);
            const laneCenterX = (laneXStart + laneWidth / 2) / size;
            entities.push({
                type: 'gate',
                gateType: 'red',
                lane: laneIndex,
                x: laneCenterX,
                yRel: standardYRel - 0.05,
                z: 0.0,
                size: 140,
                speed: GATE_SPEED,
                hit: false
            });
            lastSpawnedGateType = 'red';
        } else {
            // Spawn Green Gate (Spanning all three lanes)
            entities.push({
                type: 'gate',
                gateType: 'green',
                lane: -1, // Spans all lanes
                x: 0,
                yRel: standardYRel - 0.05,
                z: 0.0,
                size: size * 2,
                speed: GATE_SPEED,
                hit: false
            });
            lastSpawnedGateType = 'green';
        }
    }

    rainbowTimer += dt;
    const currentRainbowInterval = RAINBOW_SPAWN_INTERVAL / globalSpeedMultiplier;
    if (rainbowTimer >= currentRainbowInterval) {
        rainbowTimer -= currentRainbowInterval; 
        entities.push({
            type: 'rainbow',
            x: 0,           
            yRel: 0.5,      
            z: 0.0,
            speed: RAINBOW_SPEED,
            passed: false
        });
    }

    const playerBox = getPlayerBoundingBox();

    for (let i = entities.length - 1; i >= 0; i--) {
        const ent = entities[i];
        // Scale entity advancement speed by globalSpeedMultiplier
        ent.z += ent.speed * globalSpeedMultiplier * dt;

        if (ent.type === 'star' && !ent.collected && ent.z >= 0.98) {
            if (ent.lane === player.lane) {
                const p = projection.project(ent);
                const drawSize = ent.size * p.scale;
                const starBox = {
                    x: p.x - drawSize * 0.4,
                    y: p.y - drawSize * 0.4,
                    width: drawSize * 0.8,
                    height: drawSize * 0.8
                };

                const collision = (
                    playerBox.x < starBox.x + starBox.width &&
                    playerBox.x + playerBox.width > starBox.x &&
                    playerBox.y < starBox.y + starBox.height &&
                    playerBox.y + playerBox.height > starBox.y
                );

                if (collision) {
                    ent.collected = true;
                    collectedStars++;
                    createStarBurst(p.x, p.y, 14, 1.0);
                    entities.splice(i, 1);
                    continue;
                }
            }
        }

        // --- GATE HURDLE COLLISION & PENALTIES ---
        if (ent.type === 'gate' && !ent.hit && ent.z >= 0.95) {
            let hitCondition = false;
            if (ent.gateType === 'red') {
                if (ent.lane === player.lane) hitCondition = true;
            } else if (ent.gateType === 'green') {
                if (player.yOffset < 60) hitCondition = true;
            }

            if (hitCondition) {
                const p = projection.project(ent);
                let gateBox;
                if (ent.gateType === 'red') {
                    const drawSize = ent.size * p.scale;
                    gateBox = {
                        x: p.x - drawSize * 0.4,
                        y: p.y - drawSize * 0.4,
                        width: drawSize * 0.8,
                        height: drawSize * 0.8
                    };
                } else {
                    const drawW = ent.size * p.scale;
                    const drawH = (ent.size * 0.4) * p.scale;
                    gateBox = {
                        x: p.x - drawW * 0.5,
                        y: p.y - drawH * 0.5,
                        width: drawW,
                        height: drawH
                    };
                }

                const collision = (
                    playerBox.x < gateBox.x + gateBox.width &&
                    playerBox.x + playerBox.width > gateBox.x &&
                    playerBox.y < gateBox.y + gateBox.height &&
                    playerBox.y + playerBox.height > gateBox.y
                );

                if (collision) {
                    ent.hit = true;
                    if (ent.gateType === 'red') {
                        collectedStars = Math.floor(collectedStars / 2);
                    } else {
                        collectedStars = Math.max(0, Math.floor(collectedStars * 2 / 3));
                    }
                    // Reset speed back to initial speed (1.0x) when hitting a gate
                    globalSpeedMultiplier = 1.0;

                    triggerCameraShake(25, 0.45);
                    createStarBurst(p.x, p.y, 45, 2.2);
                    entities.splice(i, 1);
                    continue;
                }
            }
        }

        if (ent.type === 'rainbow' && !ent.passed && ent.z >= 1.0) {
            ent.passed = true;
            passedRainbows++;
            // Increase speed by 5% whenever a rainbow is passed
            globalSpeedMultiplier *= 1.05;
        }

        if (ent.z >= 0) {
            const p = projection.project(ent);
            let isOffScreen = false;

            if (ent.type === 'star' || ent.type === 'gate' || ent.type === 'rainbow') {
                const drawSize = (ent.type === 'rainbow' ? (70 * 20) : ent.size) * p.scale;
                const padding = 100;
                const top = p.y - (drawSize * 0.5);
                const bottom = p.y + (drawSize * 0.5);
                const left = p.x - (drawSize * 0.5);
                const right = p.x + (drawSize * 0.5);

                isOffScreen = (ent.z >= 1.0) || (top > canvas.height + padding) || (bottom < -padding) || (right < -padding) || (left > canvas.width + padding);
            } else if (ent.type === 'sparkle' || ent.type === 'cloud') {
                const drawSize = ent.size * p.scale;
                const drawH = ent.type === 'cloud' ? drawSize * 0.5 : drawSize;
                const top = p.y - drawH / 2;
                const bottom = p.y + drawH / 2;
                const left = p.x - drawSize / 2;
                const right = p.x + drawSize / 2;

                isOffScreen = (top > canvas.height) || (bottom < 0) || (right < 0) || (left > canvas.width) || (ent.z >= 1.0);
            }

            if (isOffScreen) {
                if (ent.type === 'star' || ent.type === 'gate' || ent.type === 'rainbow') {
                    entities.splice(i, 1);
                } else {
                    resetEntity(ent);
                }
            }
        }
    }

    // --- UPDATE BURST PARTICLES ---
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.rotation += p.vRot * dt;
        p.life -= p.decay * dt;
        p.alpha = Math.max(0, p.life);

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }

    hudStarsElem.textContent = collectedStars;
    hudDistElem.textContent = gameDistance.toFixed(0);
    hudRainbowsElem.textContent = passedRainbows;
}

function renderLanes() {
    const { size } = projection.getCubeParams();

    const hexToRgba = (hex, alpha) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    };

    const baseConfigs = [
        { c1: '#ffbe0b', c2: '#fb5607' },
        { c1: '#3a86ff', c2: '#8338ec' },
        { c1: '#ff006e', c2: '#90003a' }
    ];

    const numLanes = 3;
    const laneWidth = (size * 2) / numLanes;
    const bottomY = size; 

    const originPoint = projection.project({ x: 0, yRel: 0.5 + bottomY / (size * 2), z: -5.0 });

    for (let i = 0; i < numLanes; i++) {
        const xStart = -size + (i * laneWidth);
        const xEnd = xStart + laneWidth;

        const frontRight = projection.project({ x: xEnd / size,   yRel: 0.5 + bottomY / (size * 2), z: 1.0 });
        const frontLeft  = projection.project({ x: xStart / size, yRel: 0.5 + bottomY / (size * 2), z: 1.0 });

        const extendToBottom = (origin, pt) => {
            if (pt.y >= canvas.height) return pt; 
            const scale = (canvas.height - origin.y) / (pt.y - origin.y);
            return {
                x: origin.x + (pt.x - origin.x) * scale,
                y: canvas.height
            };
        };

        const extFrontRight = extendToBottom(originPoint, frontRight);
        const extFrontLeft = extendToBottom(originPoint, frontLeft);

        const gradX1 = originPoint.x;
        const gradY1 = originPoint.y;
        const gradX2 = (frontLeft.x + frontRight.x) / 2;
        const gradY2 = (frontLeft.y + frontRight.y) / 2;

        const { c1, c2 } = baseConfigs[i];
        const grad = ctx.createLinearGradient(gradX1, gradY1, gradX2, gradY2);

        grad.addColorStop(0.0, hexToRgba(c1, 0));
        grad.addColorStop(0.1, hexToRgba(c1, 1));
        grad.addColorStop(0.5, c2);

        ctx.save();
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(originPoint.x, originPoint.y);
        ctx.lineTo(extFrontRight.x, extFrontRight.y);
        ctx.lineTo(extFrontLeft.x, extFrontLeft.y);
        ctx.closePath();
        ctx.fill();

        const strokeGrad = ctx.createLinearGradient(gradX1, gradY1, gradX2, gradY2);
        strokeGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0)');
        strokeGrad.addColorStop(0.1, 'rgba(255, 255, 255, 0.4)');
        strokeGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.4)');

        ctx.strokeStyle = strokeGrad;
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.restore();
    }
}

function renderPlayer() {
    const { size } = projection.getCubeParams();
    const numLanes = 3;
    const laneWidth = (size * 2) / numLanes;
    const bottomY = size; 

    const originPoint = projection.project({ x: 0, yRel: 0.5 + bottomY / (size * 2), z: -5.0 });

    const xStart = -size + (player.lane * laneWidth);
    const laneCenterX = (xStart + laneWidth / 2) / size;

    const frontCenter = projection.project({
        x: laneCenterX,
        yRel: 0.5 + bottomY / (size * 2),
        z: 1.0
    });

    const screenY = canvas.height - 40 - player.yOffset;

    const t = (screenY - originPoint.y) / (frontCenter.y - originPoint.y);
    const screenX = originPoint.x + (frontCenter.x - originPoint.x) * t;

    const h = player.size; 

    const bobOffset = player.yOffset === 0 ? Math.sin(gameTime * 14 * Math.sqrt(globalSpeedMultiplier)) * 8 : 0; 
    const tilt = Math.sin(gameTime * 7) * 0.03;      

    ctx.save();
    ctx.translate(screenX, screenY + bobOffset);
    ctx.rotate(tilt);

    const img = ASSETS.unicornSide;
    const aspectRatio = 60 / 85; 
    const w = h * aspectRatio;

    if (player.facing === 'left') {
        ctx.scale(-1, 1);
    }

    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, -w / 2, -h, w, h);
    } else {
        ctx.fillStyle = '#ff006e';
        ctx.beginPath();
        ctx.arc(0, -h / 2, h / 4, 0, Math.PI * 2);
        ctx.fill();
    }

    if (debugMode) {
        ctx.strokeStyle = '#00ffcc';
        ctx.lineWidth = 2;
        ctx.strokeRect(-w / 2, -h, w, h);
    }
    ctx.restore();
}

// --- CANVAS RENDERING PROCEDURAL RED GATE (ONE LANE) ---
function drawRedGate(targetCtx, bx, by, bw, bh) {
    targetCtx.save();
    
    const postW = bw * 0.12;
    const innerX = bx + postW;
    const innerW = bw - (postW * 2);

    // Left and Right Posts
    targetCtx.fillStyle = '#ffffff';
    targetCtx.fillRect(bx, by, postW, bh);
    targetCtx.fillRect(bx + bw - postW, by, postW, bh);

    // Post Red Caps/Trims
    targetCtx.fillStyle = '#d32f2f';
    targetCtx.fillRect(bx, by, postW, bh * 0.15);
    targetCtx.fillRect(bx + bw - postW, by, postW, bh * 0.15);
    targetCtx.fillRect(bx, by + bh * 0.85, postW, bh * 0.15);
    targetCtx.fillRect(bx + bw - postW, by + bh * 0.85, postW, bh * 0.15);

    // 3 Solid Horizontal Hurdle Bars
    const barH = bh * 0.16;
    const barSpacing = (bh - (3 * barH)) / 4;

    for (let b = 0; b < 3; b++) {
        const barY = by + barSpacing + b * (barH + barSpacing);

        // White base bar
        targetCtx.fillStyle = '#f8f9fa';
        targetCtx.fillRect(innerX, barY, innerW, barH);

        // Red Derby Stripes Pattern
        targetCtx.fillStyle = '#d32f2f';
        const stripeW = barH * 1.2;
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.rect(innerX, barY, innerW, barH);
        targetCtx.clip();

        for (let sx = innerX - barH; sx < innerX + innerW + barH; sx += stripeW * 2) {
            targetCtx.beginPath();
            targetCtx.moveTo(sx, barY + barH);
            targetCtx.lineTo(sx + stripeW, barY + barH);
            targetCtx.lineTo(sx + stripeW * 2, barY);
            targetCtx.lineTo(sx + stripeW, barY);
            targetCtx.closePath();
            targetCtx.fill();
        }
        targetCtx.restore();

        // Bar Outlines
        targetCtx.strokeStyle = '#9a0007';
        targetCtx.lineWidth = Math.max(1, bw * 0.015);
        targetCtx.strokeRect(innerX, barY, innerW, barH);
    }

    targetCtx.restore();
}

// --- CANVAS RENDERING PROCEDURAL GREEN GATE (THREE LANES) ---
function drawGreenGate(targetCtx, bx, by, bw, bh) {
    targetCtx.save();
    
    const postW = bw * 0.06;
    const innerX = bx + postW;
    const innerW = bw - (postW * 2);

    // Left and Right Green Support Posts
    targetCtx.fillStyle = '#2e7d32';
    targetCtx.fillRect(bx, by, postW, bh);
    targetCtx.fillRect(bx + bw - postW, by, postW, bh);

    // Post Accent Caps
    targetCtx.fillStyle = '#1b5e20';
    targetCtx.fillRect(bx, by, postW, bh * 0.15);
    targetCtx.fillRect(bx + bw - postW, by, postW, bh * 0.15);
    targetCtx.fillRect(bx, by + bh * 0.85, postW, bh * 0.15);
    targetCtx.fillRect(bx + bw - postW, by + bh * 0.85, postW, bh * 0.15);

    // Single Horizontal Green Bar Spanning Three Lanes
    const barH = bh * 0.25;
    const barY = by + (bh - barH) / 2;

    targetCtx.fillStyle = '#4caf50';
    targetCtx.fillRect(innerX, barY, innerW, barH);

    // White Hazard Stripes on the Bar
    targetCtx.fillStyle = '#ffffff';
    const stripeW = barH * 1.2;
    targetCtx.save();
    targetCtx.beginPath();
    targetCtx.rect(innerX, barY, innerW, barH);
    targetCtx.clip();

    for (let sx = innerX - barH; sx < innerX + innerW + barH; sx += stripeW * 2) {
        targetCtx.beginPath();
        targetCtx.moveTo(sx, barY + barH);
        targetCtx.lineTo(sx + stripeW, barY + barH);
        targetCtx.lineTo(sx + stripeW * 2, barY);
        targetCtx.lineTo(sx + stripeW, barY);
        targetCtx.closePath();
        targetCtx.fill();
    }
    targetCtx.restore();

    // Bar Outline
    targetCtx.strokeStyle = '#1b5e20';
    targetCtx.lineWidth = Math.max(1, bw * 0.015);
    targetCtx.strokeRect(innerX, barY, innerW, barH);

    targetCtx.restore();
}

function renderParticles() {
    if (!showSparkleLayer) return;
    const img = ASSETS.star;
    if (!img || !img.complete || img.naturalWidth === 0) return;

    particles.forEach(p => {
        sparkleCtx.save();
        sparkleCtx.globalAlpha = p.alpha;
        sparkleCtx.translate(p.x, p.y);
        sparkleCtx.rotate(p.rotation);
        const currentSize = p.size * p.life;
        sparkleCtx.drawImage(img, -currentSize / 2, -currentSize / 2, currentSize, currentSize);
        sparkleCtx.restore();
    });
}

function render(timestamp) {
    cloudCtx.clearRect(0, 0, cloudCanvas.width, cloudCanvas.height);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    sparkleCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);

    // Apply Camera Shake offset to all layers
    cloudCtx.save();
    ctx.save();
    sparkleCtx.save();

    cloudCtx.translate(shakeOffsetX, shakeOffsetY);
    ctx.translate(shakeOffsetX, shakeOffsetY);
    sparkleCtx.translate(shakeOffsetX, shakeOffsetY);

    renderLanes();

    entities.sort((a, b) => projection.project(b).currentZ - projection.project(a).currentZ);

    entities.forEach(ent => {
        if (ent.z < 0) return;

        const p = projection.project(ent);

        let bx = 0, by = 0, bw = 0, bh = 0;
        
        let targetCtx = ctx;
        if (ent.type === 'cloud') {
            targetCtx = cloudCtx;
        } else if (ent.type === 'sparkle') {
            targetCtx = sparkleCtx;
        }

        if (ent.type === 'rainbow') {
            bw = (70 * 20) * p.scale;
            bh = (40 * 20) * p.scale;
            bx = p.x - bw / 2;
            by = p.y - bh / 2;
        } else if (ent.type === 'gate') {
            if (ent.gateType === 'red') {
                const drawSize = ent.size * p.scale;
                bw = drawSize;
                bh = drawSize;
                bx = p.x - drawSize / 2;
                by = p.y - drawSize / 2;
            } else {
                bw = ent.size * p.scale;
                bh = (ent.size * 0.4) * p.scale;
                bx = p.x - bw / 2;
                by = p.y - bh / 2;
            }
        } else if (ent.type === 'star') {
            const drawSize = ent.size * p.scale;
            bw = drawSize;
            bh = drawSize;
            bx = p.x - drawSize / 2;
            by = p.y - drawSize / 2;
        } else if (ent.type === 'sparkle' || ent.type === 'cloud') {
            const drawSize = ent.size * p.scale;
            bw = drawSize;
            bh = ent.type === 'cloud' ? drawSize * 0.5 : drawSize;
            bx = p.x - bw / 2;
            by = p.y - bh / 2;
        }

        targetCtx.save();

        if (ent.type === 'cloud') {
            targetCtx.globalAlpha = Math.min(1.0, Math.max(0.0, ent.z));
        } else if (ent.type === 'rainbow') {
            targetCtx.globalAlpha = Math.min(1.0, Math.max(0.0, ent.z));
        }

        const img = ASSETS[ent.type];
        if (ent.type === 'gate') {
            if (ent.gateType === 'red') {
                drawRedGate(targetCtx, bx, by, bw, bh);
            } else {
                drawGreenGate(targetCtx, bx, by, bw, bh);
            }
        } else if (img && img.complete && img.naturalWidth !== 0) {
            targetCtx.drawImage(img, bx, by, bw, bh);
        } else if (ent.type === 'cloud') {
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            targetCtx.beginPath();
            targetCtx.ellipse(p.x, p.y, bw / 2, bh / 2, 0, 0, Math.PI * 2);
            targetCtx.fill();
        }

        targetCtx.restore();

        if (debugMode) {
            let debugColor = '#ff0055';
            if (ent.type === 'sparkle') debugColor = '#00ffcc';
            if (ent.type === 'cloud') debugColor = '#ffaa00';
            if (ent.type === 'gate') debugColor = ent.gateType === 'red' ? '#ff0000' : '#00ff00';
            if (ent.type === 'rainbow') debugColor = '#ff00ff';

            targetCtx.strokeStyle = debugColor;
            targetCtx.lineWidth = 1;
            targetCtx.strokeRect(bx, by, bw, bh);
        }
    });

    renderPlayer();
    renderParticles();

    if (debugMode) {
        renderWireframeBox();
        renderSpawnerIndicators();
        
        const pBox = getPlayerBoundingBox();
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(pBox.x, pBox.y, pBox.width, pBox.height);
        
        fpsElem.textContent = `FPS: 60 | Speed: ${globalSpeedMultiplier.toFixed(2)}x | Entities: ${entities.length} | Dist: ${gameDistance.toFixed(0)}m | Stars: ${collectedStars} | Rainbows: ${passedRainbows}`;
    }

    cloudCtx.restore();
    ctx.restore();
    sparkleCtx.restore();
}

let lastTime = 0;
let isPaused = false;

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        isPaused = true;
    } else {
        isPaused = false;
        lastTime = performance.now();
    }
});

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    if (!isPaused) {
        update(dt, timestamp);
        render(timestamp);
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
